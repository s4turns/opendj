name: build

on:
  push:
    branches: [main, testing]
  pull_request:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # actions/checkout is a JavaScript action, so the runner needs a node
      # binary inside the container to run it at all. The stock Fedora image has
      # neither node nor git, which is why this job used to fail in two seconds
      # before reaching a compiler. This step is plain shell, so it runs first
      # without needing either.
      - name: Install node and git so the checkout action can run
        run: dnf install -y nodejs git

      - uses: actions/checkout@v4

      - name: Install JUCE system dependencies
        run: >
          dnf install -y
          gcc-c++ cmake ninja-build git pkgconf-pkg-config
          alsa-lib-devel pipewire-jack-audio-connection-kit-devel sqlite-devel
          freetype-devel fontconfig-devel
          libX11-devel libXext-devel libXinerama-devel
          libXrandr-devel libXcursor-devel libXcomposite-devel
          mesa-libGL-devel

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential cmake ninja-build git pkg-config
          libasound2-dev libjack-jackd2-dev libsqlite3-dev
          libfreetype-dev libfontconfig1-dev
          libx11-dev libxext-dev libxinerama-dev
          libxrandr-dev libxcursor-dev libxcomposite-dev
          libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
